[package]
name = "real-client"
version = "0.1.0"
description = "Real Agent 工作台（Tauri 壳）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
# 2026-09-06：外部链接（充值页等）经 opener 插件交给系统默认浏览器打开
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "real_client_lib"
# 桌面壳只需 rlib（bin 引用 lib）；staticlib/cdylib 是移动端模板遗留——
# 它们会在 Windows 上额外构建 DLL，MSVC 链接器随之打印"正在创建库
# .lib/.exp"，被 linker_messages 检查翻成常驻警告。从源头去掉，不消音。
crate-type = ["rlib"]
